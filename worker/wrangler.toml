# Michi transfer-key sync: stores end-to-end encrypted progress blobs in Workers KV.
name = "michi-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Created by tools/deploy-sync.sh (wrangler kv namespace create SLOTS); id filled in there.
[[kv_namespaces]]
binding = "SLOTS"
id = "REPLACE_WITH_KV_ID"

# Per-IP request limit to slow down key guessing.
[[ratelimits]]
name = "LIMITER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }
